name: Portal checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate HTML
        run: npx --yes html-validate@8.24.1 portal/index.html
      - name: Validate JavaScript
        run: node --check portal/app.js
      - name: Verify private prices are not public
        shell: bash
        run: |
          if grep -R -n -E --binary-files=without-match \
            --include='*.html' --include='*.css' --include='*.js' --include='*.md' --include='*.sql' \
            '\$[0-9]' portal; then
            echo "Private pricing must stay out of the public repository."
            exit 1
          fi
      - name: Verify local asset paths are not public
        shell: bash
        run: |
          if grep -R -n -E --binary-files=without-match \
            --include='*.html' --include='*.css' --include='*.js' --include='*.md' --include='*.sql' \
            'F:/|F:\\' portal; then
            echo "Local workstation paths must not be committed."
            exit 1
          fi
